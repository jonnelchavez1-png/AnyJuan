<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POS</title>
<style>
:root{--bg:#eef1f3;--panel:#fff;--ink:#14202b;--mute:#5d6b78;--line:#d7dde2;--accent:#008B8B;--accent-ink:#fff;--warn:#b45f06;--bad:#b3261e;--r:10px}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--panel:#18222b;--ink:#e8edf1;--mute:#93a1ad;--line:#2b3946;--accent:#3fd0d0;--accent-ink:#022b2b;--warn:#e0a24a;--bad:#ff8a80}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:.6rem .9rem;min-height:44px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}
input,select{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:.6rem .7rem;min-height:44px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.center{min-height:100%;display:grid;place-items:center;padding:1rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1.4rem;width:min(360px,100%);display:grid;gap:.8rem}
.card h1{margin:0;font-size:1.3rem}
.pw{position:relative}
.pw input{padding-right:3rem}
.pw button{position:absolute;right:2px;top:2px;min-height:40px;width:40px;padding:0;border:0;background:transparent;display:grid;place-items:center}
.msg{color:var(--bad);min-height:1.3em;font-size:.95rem;margin:0}
#app{height:100%;display:grid;grid-template-rows:auto 1fr}
header{display:flex;gap:.8rem;align-items:center;padding:.6rem 1rem;background:var(--panel);border-bottom:1px solid var(--line)}
header strong{font-size:1.1rem;flex:1}
header span{color:var(--mute);font-size:.9rem}
main{display:grid;grid-template-columns:1fr 380px;gap:1rem;padding:1rem;min-height:0}
.left{display:grid;grid-template-rows:auto auto 1fr;gap:.7rem;min-height:0}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:2px}
.chips button{white-space:nowrap;border-radius:99px;min-height:38px}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.6rem;overflow:auto;align-content:start;padding-bottom:1rem}
.prod{text-align:left;display:grid;gap:.25rem;min-height:92px;align-content:space-between}
.prod b{font-weight:600}
.prod small{color:var(--mute)}
.prod .price{font-size:1.05rem}
.prod.low small{color:var(--warn)}
.prod:disabled small{color:var(--bad)}
.cart{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-rows:auto 1fr auto;min-height:0}
.cart h2{margin:0;padding:.8rem 1rem;font-size:1rem;border-bottom:1px solid var(--line)}
.lines{overflow:auto;padding:.4rem 1rem}
.empty{color:var(--mute);padding:1.5rem 0;text-align:center}
.line{display:grid;grid-template-columns:1fr auto;gap:.2rem .6rem;padding:.6rem 0;border-bottom:1px dashed var(--line)}
.qty{display:flex;align-items:center;gap:.3rem}
.qty button{min-height:36px;min-width:36px;padding:0}
.pay{padding:1rem;border-top:1px solid var(--line);display:grid;gap:.6rem}
.row{display:flex;justify-content:space-between;gap:.5rem}
.row.mute{color:var(--mute);font-size:.92rem}
.total{font-size:2rem;font-weight:700;line-height:1.1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:1rem;overflow:auto}
.sheet{background:var(--panel);border-radius:var(--r);padding:1rem;display:grid;gap:.8rem;max-height:100%;overflow:auto}
#receipt{background:#fff;color:#000;font:13px/1.35 ui-monospace,Menlo,Consolas,monospace;padding:10px;margin:0 auto}
#receipt .c{text-align:center}
#receipt .r{display:flex;justify-content:space-between;gap:8px}
#receipt hr{border:0;border-top:1px dashed #000;margin:6px 0}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;flex:none}
.seg button{border:0;border-radius:0;min-width:50px;padding:.5rem}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.disc{display:flex;gap:.5rem}
.wide{width:min(720px,100%)}
.sheet h2{margin:0;font-size:1.15rem}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.fields .full{grid-column:1/-1}
.fields label{display:grid;gap:.2rem;font-size:.92rem;color:var(--mute)}
.fields label.chk{display:flex;align-items:center;gap:.5rem;color:var(--ink)}
.fields input[type=checkbox]{width:22px;min-height:22px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
.prow small{display:block;color:var(--mute)}
.prow.off{opacity:.55}
#plist{max-height:36vh;overflow:auto}
@media (max-width:820px){
 header{flex-wrap:wrap}
 header span{display:none}
 main{grid-template-columns:1fr;grid-auto-rows:min-content;padding:.7rem .7rem 5rem;overflow:auto}
 .left{grid-template-rows:auto auto auto}
 .grid{overflow:visible;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
 .cart{position:fixed;left:0;right:0;bottom:0;z-index:20;border-radius:16px 16px 0 0;max-height:90vh;box-shadow:0 -6px 24px rgba(0,0,0,.2)}
 .cart.open{overflow:auto}
 .cart h2{cursor:pointer;display:flex;justify-content:space-between;gap:.5rem}
 .cart h2::after{content:"\25B2";color:var(--mute)}
 .cart.open h2::after{content:"\25BC"}
 .cart:not(.open) .lines,.cart:not(.open) .pay{display:none}
 .cart:not(.open) h2{border-bottom:0}
 .lines{max-height:28vh}
 .fields{grid-template-columns:1fr}
}
@media print{
 body *{visibility:hidden}
 #receipt,#receipt *{visibility:visible}
 #receipt{position:absolute;left:0;top:0;margin:0;padding:0}
 @page{margin:2mm}
}
</style>
</head>
<body>

<section id="login" class="center">
  <div class="card">
    <h1 id="loginTitle">Sign in</h1>
    <label>Username<input id="u" autocomplete="username" autocapitalize="none"></label>
    <div>
      <label for="pin">PIN</label>
      <div class="pw">
        <input id="pin" type="password" inputmode="numeric" autocomplete="current-password">
        <button type="button" id="eye" aria-label="Show PIN" aria-pressed="false">
          <svg id="eyeOn" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg id="eyeOff" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.1-5.9M9.9 4.2A10.7 10.7 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2M1 1l22 22"/></svg>
        </button>
      </div>
    </div>
    <p class="msg" id="loginMsg" role="alert"></p>
    <button class="primary" id="loginBtn">Sign in</button>
  </div>
</section>

<div id="app" hidden>
  <header>
    <strong id="biz"></strong>
    <span id="who"></span>
    <button id="prodBtn" hidden>Products</button>
    <button id="setBtn" hidden>Settings</button>
    <button id="logout">Sign out</button>
  </header>
  <main>
    <div class="left">
      <input id="search" type="search" placeholder="Search name, SKU or scan a barcode" aria-label="Search products">
      <div class="chips" id="chips"></div>
      <div class="grid" id="grid"></div>
    </div>
    <aside class="cart" id="cart">
      <h2 id="cartTitle">Current sale</h2>
      <div class="lines" id="lines"></div>
      <div class="pay">
        <div class="row mute"><span>Subtotal</span><span class="num" id="sub"></span></div>
        <div id="discWrap" hidden>
          <label for="disc">Discount</label>
          <div class="disc">
            <div class="seg" role="group" aria-label="Discount type"><button type="button" id="dFix" aria-pressed="true">Amt</button><button type="button" id="dPct" aria-pressed="false">%</button></div>
            <input id="disc" type="number" min="0" step="0.01" inputmode="decimal">
          </div>
        </div>
        <div class="row mute" id="discRow" hidden><span>Discount</span><span class="num" id="discV"></span></div>
        <div class="row mute"><span id="taxLbl">Tax</span><span class="num" id="taxV"></span></div>
        <div class="row"><span>Total</span><span class="total num" id="tot"></span></div>
        <div class="two">
          <label>Payment<select id="method"></select></label>
          <label id="tendWrap">Cash received<input id="tend" type="number" min="0" step="0.01" inputmode="decimal"></label>
        </div>
        <label id="refWrap" hidden>Reference number (optional)<input id="ref" maxlength="40" autocomplete="off"></label>
        <div class="row mute" id="chgRow"><span>Change</span><span class="num" id="chg">0.00</span></div>
        <p class="msg" id="saleMsg" role="alert"></p>
        <button class="primary" id="charge" disabled>Charge</button>
      </div>
    </aside>
  </main>
</div>

<div class="modal" id="pm" hidden>
  <div class="sheet wide">
    <div class="row"><h2>Products and services</h2><button id="pmClose">Close</button></div>
    <div id="plist"></div>
    <h2 id="pfTitle">Add product or service</h2>
    <div class="fields">
      <label class="full">Name<input id="f_name" maxlength="80"></label>
      <label>Type<select id="f_type"><option value="stock">Product (counts stock)</option><option value="service">Service (no stock)</option></select></label>
      <label>Category<input id="f_cat" list="cats" maxlength="40" placeholder="Pick or type a new one"><datalist id="cats"></datalist></label>
      <label>Selling price (what the customer pays)<input id="f_price" type="number" min="0" step="0.01" inputmode="decimal"></label>
      <label>Cost price (what it costs you)<input id="f_cost" type="number" min="0" step="0.01" inputmode="decimal"></label>
      <label id="f_addWrap">Add stock<input id="f_add" type="number" min="0" step="1" inputmode="numeric"></label>
      <label id="f_reoWrap">Warn when stock is at or below<input id="f_reo" type="number" min="0" step="1" inputmode="numeric"></label>
      <label>Barcode (optional)<input id="f_bar" maxlength="40"></label>
      <label>Unit<input id="f_unit" maxlength="12" placeholder="pc, kg, hour"></label>
      <label class="chk full"><input type="checkbox" id="f_act" checked> Show in POS</label>
    </div>
    <p class="msg" id="pfMsg" role="alert"></p>
    <div class="two"><button id="pfNew">Clear form</button><button class="primary" id="pfSave">Save</button></div>
  </div>
</div>

<div class="modal" id="sm" hidden>
  <div class="sheet wide">
    <div class="row"><h2>Settings</h2><button id="smClose">Close</button></div>
    <div class="fields">
      <label class="full">Business name<input id="s_name" maxlength="60"></label>
      <label>Currency symbol<input id="s_cur" maxlength="4"></label>
      <label>Tax rate (%)<input id="s_tax" type="number" min="0" max="100" step="0.01" inputmode="decimal"></label>
      <label class="chk full"><input type="checkbox" id="s_incl"> Prices already include tax</label>
      <label class="full">Payment methods (separate with commas)<input id="s_meth" maxlength="300"></label>
      <label>Receipt paper<select id="s_w"><option value="80mm">80mm</option><option value="58mm">58mm</option></select></label>
      <label>Receipt message<input id="s_foot" maxlength="120"></label>
    </div>
    <p class="msg" id="smMsg" role="alert"></p>
    <button class="primary" id="smSave">Save settings</button>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet">
    <div id="receipt"></div>
    <div class="two"><button id="print">Print receipt</button><button class="primary" id="done">New sale</button></div>
  </div>
</div>

<script>
// 1) After deploying the Apps Script web app, paste its URL here. It is not a secret; it is the public address of the API.
const API_URL = 'https://script.google.com/macros/s/AKfycbwOyfhnHyf1V2rUj4MmxS0zK64Ht8qV2S618UnCb8rhIEmEJ3VTl4_AX9Ltwv2EYewT/exec';

const $ = s => document.querySelector(s);
const st = { dtype: 'fix', editId: null, token: null, user: null, cfg: {}, prods: [], cat: 'All', q: '', cart: {}, rid: null, busy: false };
try { st.token = sessionStorage.getItem('t'); st.user = JSON.parse(sessionStorage.getItem('u') || 'null'); st.cfg = JSON.parse(sessionStorage.getItem('c') || '{}'); } catch (e) {}

const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; };
const money = c => (st.cfg.currency || '') + (c / 100).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const toCents = v => Math.max(0, Math.round((parseFloat(v) || 0) * 100));

async function api(action, payload) {
  let j;
  try {
    const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, token: st.token, payload: payload || {} }) });
    j = await r.json();
  } catch (e) {
    throw new Error('Cannot reach the server. Check the API_URL address and that the web app access is set to Anyone.');
  }
  if (!j.ok) { if (j.code === 'AUTH') signOut(); throw new Error(j.error); }
  return j.data;
}

/* ---------- login ---------- */
async function signIn() {
  $('#loginMsg').textContent = '';
  $('#loginBtn').disabled = true;
  try {
    const d = await api('login', { username: $('#u').value, pin: $('#pin').value });
    st.token = d.token; st.user = d.user; st.cfg = d.settings;
    try { sessionStorage.setItem('t', d.token); sessionStorage.setItem('u', JSON.stringify(d.user)); sessionStorage.setItem('c', JSON.stringify(d.settings)); } catch (e) {}
    $('#pin').value = '';
    await start();
  } catch (e) { $('#loginMsg').textContent = e.message; }
  $('#loginBtn').disabled = false;
}
function signOut() {
  st.token = null; st.user = null; st.cart = {};
  try { sessionStorage.clear(); } catch (e) {}
  $('#app').hidden = true; $('#login').hidden = false;
}

/* ---------- screen ---------- */
async function start() {
  $('#login').hidden = true; $('#app').hidden = false;
  document.title = st.cfg.business_name + ' POS';
  $('#biz').textContent = st.cfg.business_name;
  $('#who').textContent = st.user.name + ' (' + st.user.role.toLowerCase() + ')';
  $('#discWrap').hidden = st.user.role === 'CASHIER';
  applyCfg();
  await loadProducts();
  render();
}
async function loadProducts() {
  try { st.prods = await api('listProducts'); } catch (e) { $('#grid').textContent = e.message; return; }
  renderChips(); renderGrid();
}
function renderChips() {
  const cats = ['All', ...new Set(st.prods.map(p => p.category))];
  const box = $('#chips'); box.textContent = '';
  cats.forEach(c => { const b = el('button', '', c); b.setAttribute('aria-pressed', c === st.cat); b.onclick = () => { st.cat = c; renderChips(); renderGrid(); }; box.appendChild(b); });
}
function renderGrid() {
  const g = $('#grid'); g.textContent = '';
  const q = st.q.toLowerCase();
  const list = st.prods.filter(p => (st.cat === 'All' || p.category === st.cat) && (!q || (p.name + ' ' + p.sku + ' ' + p.barcode).toLowerCase().includes(q)));
  if (!list.length) g.appendChild(el('p', 'empty', 'No products match. Add products in the Products sheet.'));
  list.forEach(p => {
    const out = p.stock !== null && p.stock <= 0;
    const b = el('button', 'prod' + (p.low ? ' low' : '')); b.disabled = out;
    b.append(el('b', '', p.name), el('span', 'price num', money(p.price_cents)),
      el('small', '', p.stock === null ? p.unit : out ? 'Out of stock' : p.stock + ' left'));
    b.onclick = () => add(p.product_id);
    g.appendChild(b);
  });
}
const prod = id => st.prods.find(p => p.product_id === id);
function add(id) { const p = prod(id), n = (st.cart[id] || 0) + 1; if (p.stock !== null && n > p.stock) return flash('Only ' + p.stock + ' in stock'); st.cart[id] = n; render(); }
function setQty(id, n) { const p = prod(id); if (n <= 0) delete st.cart[id]; else if (p.stock !== null && n > p.stock) return flash('Only ' + p.stock + ' in stock'); else st.cart[id] = n; render(); }
function flash(t) { $('#saleMsg').textContent = t; setTimeout(() => { if ($('#saleMsg').textContent === t) $('#saleMsg').textContent = ''; }, 2500); }

function calc() {
  const ids = Object.keys(st.cart);
  const subtotal = ids.reduce((s, id) => s + prod(id).price_cents * st.cart[id], 0);
  const raw = parseFloat($('#disc').value) || 0;
  const discount = st.user.role === 'CASHIER' ? 0 : st.dtype === 'pct'
    ? Math.min(Math.round(subtotal * Math.min(Math.max(raw, 0), 100) / 100), subtotal)
    : Math.min(toCents(raw), subtotal);
  const taxable = subtotal - discount, bp = st.cfg.tax_bp;
  const tax = st.cfg.tax_inclusive ? Math.round(taxable * bp / (10000 + bp)) : Math.round(taxable * bp / 10000);
  return { ids, subtotal, discount, tax, total: st.cfg.tax_inclusive ? taxable : taxable + tax };
}
function render() {
  const c = calc(), box = $('#lines'); box.textContent = '';
  const n = c.ids.reduce((s, id) => s + st.cart[id], 0);
  $('#cartTitle').textContent = n ? 'Current sale: ' + n + (n === 1 ? ' item, ' : ' items, ') + money(c.total) : 'Current sale';
  if (!c.ids.length) box.appendChild(el('p', 'empty', 'Tap a product to start a sale.'));
  c.ids.forEach(id => {
    const p = prod(id), q = st.cart[id], d = el('div', 'line');
    const qty = el('div', 'qty'), minus = el('button', '', '−'), plus = el('button', '', '+');
    minus.setAttribute('aria-label', 'Remove one ' + p.name); plus.setAttribute('aria-label', 'Add one ' + p.name);
    minus.onclick = () => setQty(id, q - 1); plus.onclick = () => setQty(id, q + 1);
    qty.append(minus, el('span', 'num', String(q)), plus);
    d.append(el('b', '', p.name), el('span', 'num', money(p.price_cents * q)), qty, el('small', 'num', money(p.price_cents) + ' each'));
    box.appendChild(d);
  });
  $('#sub').textContent = money(c.subtotal);
  $('#discRow').hidden = !c.discount; $('#discV').textContent = '−' + money(c.discount);
  $('#taxLbl').textContent = 'Tax' + (st.cfg.tax_bp ? ' ' + (st.cfg.tax_bp / 100) + '%' + (st.cfg.tax_inclusive ? ' (included)' : '') : '');
  $('#taxV').textContent = money(c.tax);
  $('#tot').textContent = money(c.total);
  const cash = $('#method').value === 'Cash';
  $('#tendWrap').hidden = !cash; $('#chgRow').hidden = !cash; $('#refWrap').hidden = cash;
  const tend = toCents($('#tend').value);
  $('#chg').textContent = money(Math.max(0, tend - c.total));
  $('#charge').disabled = st.busy || !c.ids.length || (cash && tend < c.total);
}

/* ---------- checkout ---------- */
async function charge() {
  const c = calc(); if (!c.ids.length || st.busy) return;
  st.busy = true; render(); $('#saleMsg').textContent = '';
  st.rid = st.rid || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2) + 'xxxxxxxx'); // reused on retry so a double tap or retry never makes two sales
  try {
    const r = await api('createSale', { client_request_id: st.rid, method: $('#method').value, tendered_cents: toCents($('#tend').value),
      discount_pct: st.dtype === 'pct' ? (parseFloat($('#disc').value) || 0) : 0, discount_cents: st.dtype === 'pct' ? 0 : c.discount,
      reference: $('#ref').value, items: c.ids.map(id => ({ product_id: id, qty: st.cart[id] })) });
    st.rid = null; st.cart = {}; $('#disc').value = ''; $('#tend').value = ''; $('#ref').value = ''; $('#cart').classList.remove('open');
    showReceipt(r); loadProducts();
  } catch (e) { $('#saleMsg').textContent = e.message; }
  st.busy = false; render();
}
function showReceipt(r) {
  const box = $('#receipt'); box.textContent = '';
  box.style.width = st.cfg.receipt_width === '58mm' ? '54mm' : '76mm';
  const row = (a, b) => { const d = el('div', 'r'); d.append(el('span', '', a), el('span', '', b)); return d; };
  const t = el('div', 'c'); t.append(el('b', '', st.cfg.business_name), el('div', '', r.receipt_no), el('div', '', new Date(r.created_at).toLocaleString()), el('div', '', 'Cashier: ' + r.cashier));
  box.append(t, el('hr'));
  r.items.forEach(i => { box.append(el('div', '', i.name), row('  ' + i.qty + ' x ' + money(i.unit_cents), money(i.total_cents))); });
  box.append(el('hr'), row('Subtotal', money(r.subtotal_cents)));
  if (r.discount_cents) box.append(row('Discount', '−' + money(r.discount_cents)));
  box.append(row('Tax', money(r.tax_cents)), row('TOTAL', money(r.total_cents)), row(r.method, money(r.tendered_cents)));
  if (r.method === 'Cash') box.append(row('Change', money(r.change_cents)));
  box.append(el('hr'), el('div', 'c', st.cfg.receipt_footer));
  $('#modal').hidden = false;
}

/* ---------- events ---------- */
$('#loginBtn').onclick = signIn;
$('#pin').onkeydown = e => { if (e.key === 'Enter') signIn(); };
$('#logout').onclick = signOut;
$('#eye').onclick = () => {
  const show = $('#pin').type === 'password';
  $('#pin').type = show ? 'text' : 'password';
  $('#eyeOn').hidden = show; $('#eyeOff').hidden = !show;
  $('#eye').setAttribute('aria-pressed', show); $('#eye').setAttribute('aria-label', show ? 'Hide PIN' : 'Show PIN');
};
$('#search').oninput = e => { st.q = e.target.value; renderGrid(); };
$('#search').onkeydown = e => { // barcode scanners type the code and press Enter
  if (e.key !== 'Enter') return;
  const code = e.target.value.trim(), p = st.prods.find(x => x.barcode && x.barcode === code);
  if (p) { add(p.product_id); e.target.value = ''; st.q = ''; renderGrid(); }
};
['#disc', '#tend', '#method'].forEach(s => $(s).oninput = render);
$('#charge').onclick = charge;
$('#print').onclick = () => window.print();
$('#done').onclick = () => { $('#modal').hidden = true; $('#search').focus(); };

/* ---------- discount type, mobile cart sheet, settings applied to the screen ---------- */
function setDType(t) { st.dtype = t; $('#dFix').setAttribute('aria-pressed', t === 'fix'); $('#dPct').setAttribute('aria-pressed', t === 'pct'); render(); }
$('#dFix').onclick = () => setDType('fix');
$('#dPct').onclick = () => setDType('pct');
$('#cartTitle').onclick = () => $('#cart').classList.toggle('open');

function applyCfg() {
  document.title = st.cfg.business_name + ' POS';
  $('#biz').textContent = st.cfg.business_name;
  $('#dFix').textContent = st.cfg.currency || 'Amt';
  $('#prodBtn').hidden = st.user.role === 'CASHIER';
  $('#setBtn').hidden = st.user.role !== 'OWNER';
  const m = $('#method'), keep = m.value; m.textContent = '';
  st.cfg.payment_methods.split(',').forEach(x => { x = x.trim(); if (!x) return; const o = el('option', '', x); o.value = x; m.appendChild(o); });
  if ([...m.options].some(o => o.value === keep)) m.value = keep;
}

/* ---------- products and services ---------- */
let plist = [];
const pesos = c => (c / 100).toFixed(2);
async function openProducts() { $('#pm').hidden = false; $('#pfMsg').textContent = ''; await refreshPlist(); fillForm(null); }
async function refreshPlist() {
  try { plist = await api('listProducts', { all: true }); } catch (e) { $('#pfMsg').textContent = e.message; return; }
  const box = $('#plist'); box.textContent = '';
  if (!plist.length) box.appendChild(el('p', 'empty', 'No products yet. Fill in the form below.'));
  plist.slice().reverse().forEach(p => {
    const r = el('div', 'prow' + (p.active ? '' : ' off')), t = el('div'), b = el('button', '', 'Edit');
    t.append(el('b', '', p.name), el('small', 'num', p.category + ', ' + money(p.price_cents) + ', ' + (p.stock === null ? 'service' : p.stock + ' in stock') + (p.active ? '' : ', hidden')));
    b.onclick = () => fillForm(p); r.append(t, b); box.appendChild(r);
  });
  const dl = $('#cats'); dl.textContent = '';
  [...new Set(plist.map(p => p.category))].forEach(c => { const o = el('option'); o.value = c; dl.appendChild(o); });
}
function fillForm(p) {
  st.editId = p ? p.product_id : null;
  $('#pfTitle').textContent = p ? 'Edit ' + p.name : 'Add product or service';
  $('#f_name').value = p ? p.name : ''; $('#f_type').value = p && p.stock === null ? 'service' : 'stock';
  $('#f_cat').value = p ? p.category : ''; $('#f_price').value = p ? pesos(p.price_cents) : ''; $('#f_cost').value = p ? pesos(p.cost_cents || 0) : '';
  $('#f_add').value = ''; $('#f_reo').value = p ? (p.reorder_level || 0) : 5; $('#f_bar').value = p ? p.barcode : ''; $('#f_unit').value = p ? p.unit : 'pc';
  $('#f_act').checked = p ? p.active : true; typeChange();
}
function typeChange() { const svc = $('#f_type').value === 'service'; $('#f_addWrap').hidden = svc; $('#f_reoWrap').hidden = svc; }
async function saveProd() {
  $('#pfMsg').textContent = ''; $('#pfSave').disabled = true;
  try {
    await api('saveProduct', { product_id: st.editId, name: $('#f_name').value, category: $('#f_cat').value, track_stock: $('#f_type').value === 'stock',
      price_cents: toCents($('#f_price').value), cost_cents: toCents($('#f_cost').value), add_stock: parseInt($('#f_add').value, 10) || 0,
      reorder_level: parseInt($('#f_reo').value, 10) || 0, barcode: $('#f_bar').value, unit: $('#f_unit').value, active: $('#f_act').checked });
    await refreshPlist(); fillForm(null); await loadProducts();
    $('#pfTitle').textContent = 'Saved. Add another, or close this window.';
  } catch (e) { $('#pfMsg').textContent = e.message; }
  $('#pfSave').disabled = false;
}

/* ---------- settings (owner only) ---------- */
function openSettings() {
  const c = st.cfg; $('#smMsg').textContent = '';
  $('#s_name').value = c.business_name; $('#s_cur').value = c.currency; $('#s_tax').value = c.tax_bp / 100; $('#s_incl').checked = c.tax_inclusive;
  $('#s_meth').value = c.payment_methods; $('#s_w').value = c.receipt_width; $('#s_foot').value = c.receipt_footer; $('#sm').hidden = false;
}
async function saveSet() {
  $('#smMsg').textContent = ''; $('#smSave').disabled = true;
  try {
    st.cfg = await api('saveSettings', { business_name: $('#s_name').value, currency: $('#s_cur').value, tax_percent: parseFloat($('#s_tax').value) || 0,
      tax_inclusive: $('#s_incl').checked, payment_methods: $('#s_meth').value, receipt_width: $('#s_w').value, receipt_footer: $('#s_foot').value });
    try { sessionStorage.setItem('c', JSON.stringify(st.cfg)); } catch (e) {}
    applyCfg(); render(); $('#sm').hidden = true;
  } catch (e) { $('#smMsg').textContent = e.message; }
  $('#smSave').disabled = false;
}
$('#prodBtn').onclick = openProducts; $('#pmClose').onclick = () => { $('#pm').hidden = true; };
$('#pfSave').onclick = saveProd; $('#pfNew').onclick = () => fillForm(null); $('#f_type').onchange = typeChange;
$('#setBtn').onclick = openSettings; $('#smClose').onclick = () => { $('#sm').hidden = true; }; $('#smSave').onclick = saveSet;

if (API_URL.startsWith('PASTE')) { $('#loginMsg').textContent = 'Set API_URL in index.html first.'; }
if (st.token && st.user) start();
</script>
</body>
</html>
